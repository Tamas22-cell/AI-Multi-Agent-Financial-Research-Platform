name: MLOps OpenTelemetry and ETL CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engineering dependencies
        run: python -m pip install -r requirements-engineering.txt
      - name: Run offline MLflow, telemetry and ETL checks
        run: python -m unittest tests.test_engineering -v
